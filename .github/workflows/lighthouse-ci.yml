name: Lighthouse CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Run LHCI autorun
        run: npx -y @lhci/cli@0.11.0 autorun --upload.target=temporary-public-storage --collect.url=https://michalpycek.pl
